# Model manifest: every downloadable weight file, plus the image-model presets the switcher offers.
# Committed (same on every machine). Which preset is the default is per-machine:
# config/studio.toml [comfyui] default_image_model. Human-readable registry: docs/MODELS.md.
#
#   uv run scripts/fetch_models.py --list            # what exists, what is downloaded
#   uv run scripts/fetch_models.py sdxl-storybook    # download a preset (all its files)
#   uv run scripts/fetch_models.py sam2.1-hiera-small depth-anything-v2-small
#
# Rules (D-012, D-019): check the license before adding a file; commercial = "yes" | "no" |
# "unclear". Only presets whose every file is commercial = "yes" may be the default.
# `dest` is relative to [comfyui] models_dir.

