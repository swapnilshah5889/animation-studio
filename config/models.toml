# --------------------------------------------------------------------------- style presets
# The style switcher (D-019, D-025). studio_core.comfy_graphs builds the ComfyUI workflow from a
# style; comfy_mcp tools (Step 4) take a `style` argument and the app shows a dropdown.
# A film's style is locked once it has characters (studio_core.film), so looks stay consistent.
#
#   prompt_prefix / prompt_suffix  wrap every prompt (trigger words, quality tags)
#   negative                       the style's negative prompt (kid-safety terms are always added)
#   normal / fast                  sampler settings; `fast` may add a speed LoRA
#   vae                            all SDXL styles use the fp16-fix VAE (fp16 NaNs on MPS otherwise)

[styles.storybook]
label = "Storybook (SDXL Base 1.0 + StoryBook flat kids'-book LoRA)"
checkpoint = "sdxl-base-1.0"
vae = "sdxl-vae-fp16-fix"
loras = [{ file = "storybook-redmond-v2", strength = 0.9 }]
prompt_prefix = "KidsRedmAF, Kids Book, flat colors, simple shapes, clean outlines"
prompt_suffix = ""
negative = "photo, realistic, 3d render"
normal = { steps = 25, cfg = 6.0, sampler = "dpmpp_2m", scheduler = "karras" }
fast = { lora = "sdxl-lightning-8step-lora", steps = 8, cfg = 1.0, sampler = "euler", scheduler = "sgm_uniform" }
notes = "Default (owner's pick A). Cleanest license chain; good base for our own LoRAs later."

[styles.cutecartoon]
label = "Cute cartoon (SDXL Base 1.0 + CuteCartoon LoRA)"
checkpoint = "sdxl-base-1.0"
vae = "sdxl-vae-fp16-fix"
loras = [{ file = "cutecartoon-redmond-v2", strength = 0.9 }]
prompt_prefix = "CuteCartoonAF, Cute Cartoon, flat colors, simple shapes"
prompt_suffix = ""
negative = "photo, realistic, 3d render"
normal = { steps = 25, cfg = 6.0, sampler = "dpmpp_2m", scheduler = "karras" }
fast = { lora = "sdxl-lightning-8step-lora", steps = 8, cfg = 1.0, sampler = "euler", scheduler = "sgm_uniform" }
notes = "Alternative look on the same base; only a 170 MB LoRA."

[styles.dreamshaper-lightning]
label = "DreamShaper XL Lightning (SFW)"
checkpoint = "dreamshaper-xl-lightning-sfw"
vae = "sdxl-vae-fp16-fix"
loras = []
prompt_prefix = "children's book illustration, cartoon, flat colors, simple shapes"
prompt_suffix = ""
negative = "photo, realistic"
normal = { steps = 6, cfg = 2.0, sampler = "dpmpp_sde", scheduler = "karras" }
fast = { steps = 4, cfg = 2.0, sampler = "dpmpp_sde", scheduler = "karras" }
notes = "Owner's option B. Commercial use UNCLEAR (turbo/lcm lineage): never the default."

[styles.animagine]
label = "Animagine XL 4.0 (anime look)"
checkpoint = "animagine-xl-4.0-opt"
vae = "sdxl-vae-fp16-fix"
loras = []
prompt_prefix = "no humans, chibi, cute"
prompt_suffix = "safe, masterpiece, high score, great score, absurdres"
negative = "nsfw, lowres, bad anatomy, bad hands, text, error, worst quality, low quality, jpeg artifacts, signature, watermark"
normal = { steps = 28, cfg = 5.0, sampler = "euler_ancestral", scheduler = "normal" }
fast = { steps = 16, cfg = 5.0, sampler = "euler_ancestral", scheduler = "normal" }
notes = "Owner's option C, for the later anime tier. Danbooru-trained: 'safe' tag always, never artist tags. The Lightning LoRA degrades this model (noisy output, benchmarks.md): fast = fewer normal steps instead."
