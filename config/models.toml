# --------------------------------------------------------------------------- image-model presets
# The switcher: comfy_mcp (Step 4) takes a preset id; workflows get these settings injected.
# `fast` = the few-step variant with a speed LoRA (or a model that is few-step already).

[image_models.sdxl-storybook]
label = "SDXL Base 1.0 + StoryBook flat kids'-book LoRA"
checkpoint = "sdxl-base-1.0"
vae = "sdxl-vae-fp16-fix"
loras = [{ file = "storybook-redmond-v2", strength = 0.9 }]
trigger = "KidsRedmAF, Kids Book"
normal = { steps = 25, cfg = 6.0, sampler = "dpmpp_2m", scheduler = "karras" }
fast = { lora = "sdxl-lightning-8step-lora", steps = 8, cfg = 1.0, sampler = "euler", scheduler = "sgm_uniform" }
notes = "Default (D-019). Cleanest license chain; good base for our own LoRAs later."

[image_models.sdxl-cutecartoon]
label = "SDXL Base 1.0 + CuteCartoon LoRA"
checkpoint = "sdxl-base-1.0"
vae = "sdxl-vae-fp16-fix"
loras = [{ file = "cutecartoon-redmond-v2", strength = 0.9 }]
trigger = "CuteCartoonAF, Cute Cartoon"
normal = { steps = 25, cfg = 6.0, sampler = "dpmpp_2m", scheduler = "karras" }
fast = { lora = "sdxl-lightning-8step-lora", steps = 8, cfg = 1.0, sampler = "euler", scheduler = "sgm_uniform" }
notes = "Alternative style on the same base; only the 170 MB LoRA to download."

[image_models.dreamshaper-xl-lightning-sfw]
label = "DreamShaper XL Lightning (SFW)"
checkpoint = "dreamshaper-xl-lightning-sfw"
loras = []
trigger = ""
normal = { steps = 6, cfg = 2.0, sampler = "dpmpp_sde", scheduler = "karras" }
fast = { steps = 4, cfg = 2.0, sampler = "dpmpp_sde", scheduler = "karras" }
notes = "Commercial use unverified: never the default. Leans painterly/3D."

[image_models.animagine-xl-4]
label = "Animagine XL 4.0 (anime tier, later)"
checkpoint = "animagine-xl-4.0-opt"
loras = []
trigger = "safe"
normal = { steps = 28, cfg = 5.0, sampler = "euler_ancestral", scheduler = "normal" }
fast = { lora = "sdxl-lightning-8step-lora", steps = 8, cfg = 1.0, sampler = "euler", scheduler = "sgm_uniform" }
notes = "Anime proportions; for the future anime tier. Always include the 'safe' tag; never artist tags."
