[project]
name = "director"
version = "0.0.0"
description = "The film director: a local LLM agent that drives the MCP servers from a story prompt to a film"
requires-python = "==3.12.*"
dependencies = ["studio-core", "mcp>=2.3,<3", "jsonschema>=4", "pydantic>=2"]

[project.scripts]
director = "director.__main__:main"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
