# Isolated environment for CLAP audio-text embeddings (Step 3 task 3.5, D-036): sound-effect search.
# Same torch/transformers as envs/kokoro, so uv's cache makes this env nearly free on disk.
# Kept out of the uv workspace on purpose (D-016).
#   cd envs/clap && uv sync
[project]
name = "clap-env"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "soundfile>=0.13",
    "numpy>=2",
]

[tool.uv]
package = false
