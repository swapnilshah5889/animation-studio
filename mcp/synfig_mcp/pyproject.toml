[project]
name = "synfig-mcp"
version = "0.0.0"
description = "MCP server: the director's animation tools (shot specs, rigs, motions, renders), Synfig backend"
requires-python = "==3.12.*"
dependencies = ["studio-core", "mcp>=2.3,<3"]

[project.scripts]
synfig-mcp = "synfig_mcp.server:main"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
