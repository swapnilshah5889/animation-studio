[project]
name = "edit-mcp"
version = "0.0.0"
description = "MCP server: the director's editing tools (create a film, assemble shots, render the final video)"
requires-python = "==3.12.*"
dependencies = ["studio-core", "mcp>=2.3,<3"]

[project.scripts]
edit-mcp = "edit_mcp.server:main"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
